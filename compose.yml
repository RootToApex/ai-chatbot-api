services:
  db:
    image: postgres:15.8
    environment:
      POSTGRES_DB: ${DB_NAME:-assignment}
      POSTGRES_USER: ${DB_USER:-assignment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assignment}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-assignment}"]
      interval: 3s
      timeout: 3s
      retries: 10
